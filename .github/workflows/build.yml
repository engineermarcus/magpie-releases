# Builds Magpie from the PRIVATE source repo and publishes the APKs here (public repo => free Actions minutes).
# Needs these repo secrets: MAGPIE_READ_TOKEN (fine-grained PAT, Contents: read on engineermarcus/magpie),
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD, TMDB_TOKEN, GH_CLIENT_ID.
# Only schedule/workflow_dispatch trigger it, so forks and pull requests can never reach the secrets.
name: Build & Release APK
on:
  workflow_dispatch:
    inputs:
      debug:
        description: Print the full Gradle log (the log is PUBLIC and may show source snippets)
        type: boolean
        default: false
  schedule:
    - cron: '*/10 * * * *'   # poll the private repo for a new commit on main
concurrency:
  group: magpie-build
  cancel-in-progress: false
permissions:
  contents: write
env:
  SOURCE_REPO: engineermarcus/magpie
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env:
          TOKEN: ${{ secrets.MAGPIE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          [ -n "$TOKEN" ] || { echo "MAGPIE_READ_TOKEN secret is missing"; exit 1; }
          SHA="$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)"
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "could not read the source repo (token expired or lacks access?)"; exit 1; }
          LAST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .body 2>/dev/null | sed -n 's/^source: //p' | head -1 || true)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || [ "$SHA" != "$LAST" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; echo "up to date"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      MAGPIE_REF: ${{ needs.check.outputs.sha }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: engineermarcus/magpie
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.MAGPIE_READ_TOKEN }}
          path: src
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x src/magpie-frontend/android-client/gradlew

      - name: Fetch nodejs-mobile
        run: |
          A=src/magpie-frontend/android-client/app
          curl -fL -o /tmp/nm.zip https://github.com/digidem/nodejs-mobile/releases/download/v24.20.0-0/nodejs-mobile-android-24.20.0-0.zip
          mkdir -p $A/libnode
          unzip -q /tmp/nm.zip 'include/*' 'bin/arm64-v8a/*' 'bin/armeabi-v7a/*' -d $A/libnode

      - name: Fetch TorrServer
        run: |
          B=src/magpie-frontend/android-client/app/libnode/bin
          mkdir -p $B/arm64-v8a $B/armeabi-v7a
          curl -fL -o $B/armeabi-v7a/libtorrserver.so https://github.com/YouROK/TorrServer/releases/download/MatriX.151/TorrServer-android-arm7
          curl -fL -o $B/arm64-v8a/libtorrserver.so https://github.com/YouROK/TorrServer/releases/download/MatriX.151/TorrServer-android-arm64

      - name: Bundle Node backend
        working-directory: src/magpie-frontend/android-client/node-backend
        run: |
          npm ci --omit=dev --omit=optional >/dev/null 2>&1
          mkdir -p ../app/src/main/assets
          zip -qr ../app/src/main/assets/node-backend.zip .

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KS" | base64 -d > src/magpie-frontend/android-client/app/magpie.jks

      # This repo is new, so run_number restarts at 1. Continue from the last build made in the old repo (3.69 = code 369)
      # so the version code keeps increasing and installed apps accept the update.
      - name: Compute version
        id: ver
        run: |
          CODE=$((369 + ${{ github.run_number }}))
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$((CODE / 100)).$(printf '%02d' $((CODE % 100)))" >> $GITHUB_OUTPUT

      - name: Build release APKs
        working-directory: src/magpie-frontend/android-client
        env:
          KEYSTORE_FILE: magpie.jks
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_LOG: ${{ inputs.debug }}
        run: |
          # This repo is public, so its logs are public: keep the private source out of them unless asked.
          if [ "$DEBUG_LOG" = true ]; then
            ./gradlew assembleMobileRelease assembleTvRelease --stacktrace
          else
            ./gradlew assembleMobileRelease assembleTvRelease -q > "$RUNNER_TEMP/gradle.log" 2>&1 || { echo "Gradle build failed. Re-run with debug=true to see the log."; exit 1; }
          fi

      - name: Package
        run: |
          V=${{ steps.ver.outputs.name }}
          R=src/magpie-frontend/android-client/app/build/outputs/apk
          mkdir -p dist
          cp $R/mobile/release/*.apk "dist/magpie-v$V.apk"
          cp $R/tv/release/*.apk "dist/magpie-tv-v$V.apk"
          cp "dist/magpie-v$V.apk" dist/magpie.apk
          cp "dist/magpie-tv-v$V.apk" dist/magpie-tv.apk
          U=https://github.com/${{ github.repository }}/releases/latest/download
          echo "{\"versionCode\":${{ steps.ver.outputs.code }},\"versionName\":\"$V\",\"apkUrl\":\"$U/magpie-v$V.apk\",\"tvApkUrl\":\"$U/magpie-tv-v$V.apk\"}" > version.json
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      # The GitHub-servers workflow runs in the USER's account and can only read public things, so the server
      # code it needs is published here. A prerelease never becomes "latest", so version.json is unaffected.
      - name: Publish runner bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=${{ github.repository }}
          BUNDLE="magpie-runner-${MAGPIE_REF}.tar.gz"
          tar -czf "$BUNDLE" -C src --exclude=node_modules --exclude=__pycache__ \
            runner magpie-frontend/android-client/node-backend magpie-frontend/android-client/app/src/main/python
          gh release view runner-bundles -R "$REPO" >/dev/null 2>&1 || \
            gh release create runner-bundles -R "$REPO" --prerelease --latest=false \
              --title "Runner bundles" --notes "Server code the GitHub servers workflow downloads. Not an app release."
          gh release upload runner-bundles "$BUNDLE" -R "$REPO" --clobber
          gh api "repos/$REPO/releases/tags/runner-bundles" --jq '.assets | sort_by(.created_at) | reverse | .[30:] | .[].id' \
            | while read -r id; do gh api -X DELETE "repos/$REPO/releases/assets/$id" || true; done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: Magpie ${{ env.tag }}
          body: |
            Magpie ${{ steps.ver.outputs.name }}
            source: ${{ needs.check.outputs.sha }}
          files: |
            dist/magpie-v${{ steps.ver.outputs.name }}.apk
            dist/magpie-tv-v${{ steps.ver.outputs.name }}.apk
            dist/magpie.apk
            dist/magpie-tv.apk
            version.json
          fail_on_unmatched_files: true

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=${{ github.repository }}
          gh api "repos/${REPO}/releases?per_page=100" --jq ".[] | select(.tag_name != \"${tag}\" and .tag_name != \"runner-bundles\") | \"\(.id) \(.tag_name)\"" | while read -r id old; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/${REPO}/releases/${id}" || true
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${old}" 2>/dev/null || true
          done
